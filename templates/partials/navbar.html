<header class="site-header">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <nav class="navbar" aria-label="Main navigation">
    <a class="brand" href="{% url 'home' %}" aria-label="QuizForge home">
      <span class="brand-mark">Q</span>
      <span>QuizForge</span>
    </a>
    <button class="nav-toggle" type="button" aria-label="Open menu" aria-expanded="false" data-nav-toggle>
      <span></span><span></span><span></span>
    </button>
    <div class="nav-links" data-nav-menu>
      <a href="{% url 'quiz_list' %}">Quizzes</a>
      <a href="{% url 'leaderboard' %}">Leaderboard</a>
      <a href="{% url 'student_dashboard' %}">Dashboard</a>
      <a href="{% url 'progress' %}">Progress</a>
      <a href="{% url 'about' %}">About</a>
    </div>
    <div class="nav-actions">
      <button class="icon-btn" type="button" aria-label="Switch theme" title="Switch theme" data-theme-toggle>
        <span class="icon-sun">☀</span><span class="icon-moon">☾</span>
      </button>
      {% if request.user.is_authenticated %}
        <a class="btn btn-ghost" href="{% url 'profile' %}">Profile</a>
        <a class="btn btn-primary" href="{% url 'logout' %}">Logout</a>
      {% else %}
        <a class="btn btn-ghost" href="{% url 'login' %}">Log in</a>
        <a class="btn btn-primary" href="{% url 'signup' %}">Sign up</a>
      {% endif %}
    </div>
  </nav>
</header>
