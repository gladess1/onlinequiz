{% extends "base.html" %}
{% block title %}Log in | QuizForge{% endblock %}
{% block content %}
<section class="auth-wrap">
  <form class="auth-card" method="post" novalidate data-validate-form>
    {% csrf_token %}
    <p class="eyebrow">Welcome back</p>
    <h1>Log in to continue</h1>
    <label>Email<input type="email" name="email" placeholder="you@example.com" required></label>
    <label>Password<span class="password-field"><input type="password" name="password" required data-password><button type="button" data-password-toggle>Show</button></span></label>
    <div class="form-row"><label class="check"><input type="checkbox" name="remember"> Remember me</label><a href="{% url 'forgot_password' %}">Forgot password?</a></div>
    <button class="btn btn-primary full" type="submit">Log in</button>
    <p class="form-note">New here? <a href="{% url 'signup' %}">Create an account</a></p>
  </form>
</section>
{% endblock %}
