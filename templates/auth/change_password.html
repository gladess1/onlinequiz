{% extends "base.html" %}
{% block title %}Change Password | QuizForge{% endblock %}
{% block content %}
<section class="auth-wrap"><form class="auth-card" method="post" data-validate-form>{% csrf_token %}<p class="eyebrow">Security</p><h1>Change password</h1><label>Current password<input type="password" required></label><label>New password<input type="password" required data-strength-input></label><div class="strength-meter"><span data-strength-bar></span></div><button class="btn btn-primary full" type="submit">Save password</button></form></section>
{% endblock %}
