{% extends "base.html" %}
{% block title %}Reset Password | QuizForge{% endblock %}
{% block content %}
<section class="auth-wrap"><form class="auth-card" method="post" data-validate-form>{% csrf_token %}<p class="eyebrow">New password</p><h1>Choose a secure password</h1><label>New password<span class="password-field"><input type="password" required data-password data-strength-input><button type="button" data-password-toggle>Show</button></span></label><div class="strength-meter"><span data-strength-bar></span></div><label>Confirm password<input type="password" required></label><button class="btn btn-primary full" type="submit">Update password</button></form></section>
{% endblock %}
