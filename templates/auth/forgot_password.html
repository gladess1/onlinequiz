{% extends "base.html" %}
{% block title %}Forgot Password | QuizForge{% endblock %}
{% block content %}
<section class="auth-wrap"><form class="auth-card" method="post" data-validate-form>{% csrf_token %}<p class="eyebrow">Account recovery</p><h1>Reset your password</h1><p>Enter your email and we will send reset instructions.</p><label>Email<input type="email" name="email" required></label><button class="btn btn-primary full" type="submit">Send reset link</button></form></section>
{% endblock %}
